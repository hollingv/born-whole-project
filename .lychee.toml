# Lychee link checker configuration
# https://lychee.cli.rs/usage/config/
#
# Runs in offline mode — checks only internal links within the built site.
# External URLs are skipped entirely to avoid false positives from bot-blocking.

offline = true

# Exclude patterns (also applies when offline = false)
exclude = [
    "https://fonts.googleapis.com",
    "https://fonts.gstatic.com",
    "https://intactamerica.org",
    "https://www.tickettailor.com",
]
