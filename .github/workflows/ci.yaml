name: CI/CD

on:
  push:
    branches: [main, devel]
  pull_request:

env:
  DEPLOY_BRANCH: refs/heads/main

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run make init to initialize build env
        run: make init

      - name: Build and Test
        run: make test

      - name: Compute APP_TAG
        id: app_tag
        run: echo "tag=$(make app-tag)" >> $GITHUB_OUTPUT

      - name: Inject APP_TAG
        run: sed -i "s/__COMMIT_SHA__/${{ steps.app_tag.outputs.tag }}/g" site/index.html

      - name: Deploy to Cloudflare Pages
        if: github.ref == env.DEPLOY_BRANCH
        run: npx wrangler pages deploy site --project-name=global-autonomy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Integration tests
        if: github.ref == env.DEPLOY_BRANCH
        run: go test ./src/test-integ/... -url https://global-autonomy.pages.dev
