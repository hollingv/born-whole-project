name: CI/CD

on:
  push:
    branches: [main, devel]
  pull_request:

env:
  TARGET_DIR: dist

  # Main production branch
  MAIN_BRANCH: main
  MAIN_URL: https://bornwhole.org

  # Development branch
  DEVEL_BRANCH: devel
  DEVEL_URL: https://devel.global-autonomy.pages.dev

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    env:
      # Resolved once from secrets — available to all steps
      BWP_CF_API_TOKEN:  ${{ secrets.BWP_CF_API_TOKEN }}
      BWP_CF_ACCOUNT_ID: ${{ secrets.BWP_CF_ACCOUNT_ID }}
      BWP_YT_API_KEY:    ${{ secrets.BWP_YT_API_KEY }}
      # wrangler requires these specific names
      CLOUDFLARE_API_TOKEN:  ${{ secrets.BWP_CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.BWP_CF_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Run make init to initialize build env
        run: make init

      - name: Build and Test
        run: make test

      # -------------------------------------------------------------------------------------
      # Deploy env.MAIN_BRANCH
      # -------------------------------------------------------------------------------------
      - name: Deploy and test (${{ env.MAIN_BRANCH }})
        if: github.ref == format('refs/heads/{0}', env.MAIN_BRANCH)
        run: |
          npx wrangler pages deploy ${{ env.TARGET_DIR }} --project-name=global-autonomy --branch=${{ env.MAIN_BRANCH }}
          go test ./src/test-integ/... -url ${{ env.MAIN_URL }}

      # -------------------------------------------------------------------------------------
      # Deploy env.DEVEL_BRANCH
      # -------------------------------------------------------------------------------------
      - name: Deploy and test (${{ env.DEVEL_BRANCH }})
        if: github.ref == format('refs/heads/{0}', env.DEVEL_BRANCH)
        run: |
          npx wrangler pages deploy ${{ env.TARGET_DIR }} --project-name=global-autonomy --branch=${{ env.DEVEL_BRANCH }}
          go test ./src/test-integ/... -url ${{ env.DEVEL_URL }}
