name: CI/CD

on:
  push:
    branches: [main, devel]
  pull_request:

env:
  # Main production branch
  MAIN_BRANCH: main
  MAIN_URL: https://global-autonomy.pages.dev

  # Development branch
  DEVEL_BRANCH: devel
  DEVEL_URL: https://devel.global-autonomy.pages.dev

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run make init to initialize build env
        run: make init

      - name: Build and Test
        run: make test

      # -------------------------------------------------------------------------------------
      # Deploy env.MAIN_BRANCH
      # -------------------------------------------------------------------------------------
      - name: Deploy to Cloudflare Pages (main)
        if: github.ref == format('refs/heads/{0}', env.MAIN_BRANCH)
        run: npx wrangler pages deploy site --project-name=global-autonomy --branch=${{ env.MAIN_BRANCH }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Integration tests (main)
        if: github.ref == format('refs/heads/{0}', env.MAIN_BRANCH)
        run: go test ./src/test-integ/... -url ${{ env.MAIN_URL }}

      # -------------------------------------------------------------------------------------
      # Deploy env.DEVEL_BRANCH
      # -------------------------------------------------------------------------------------
      - name: Deploy to Cloudflare Pages (devel)
        if: github.ref == format('refs/heads/{0}', env.DEVEL_BRANCH)
        run: npx wrangler pages deploy site --project-name=global-autonomy --branch=${{ env.DEVEL_BRANCH }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Integration tests (devel)
        if: github.ref == format('refs/heads/{0}', env.DEVEL_BRANCH)
        run: go test ./src/test-integ/... -url ${{ env.DEVEL_URL }}
