# cog.toml - Cocogitto configuration
# https://docs.cocogitto.io/reference/config

# Only consider commits since the latest SemVer tag when running cog bump --auto.
# Set to true to ignore commits before the last tag.
from_latest_tag = true

# Ignore merge commits when scanning commit history.
ignore_merge_commits = false

# Silently ignore fixup commits (e.g. "fixup!" prefixed commits).
ignore_fixup_commits = false

# Restrict version bumps to commits on matching branches only.
# Example: branch_whitelist = ["main", "release/*"]
branch_whitelist = []

# Skip bump if there are untracked or uncommitted changes.
skip_untracked = false

# String appended to bump commits to prevent CI from triggering again.
skip_ci = "[skip ci]"

# Prefix applied to all version tags. Set to "v" to produce tags like "v1.0.0".
tag_prefix = "v"

# Default pre-release pattern used when auto-incrementing pre-release versions.
# The * is replaced by the numeric identifier e.g. "alpha.0", "alpha.1".
pre = "alpha.*"

# Whether to skip creating a bump commit when running cog bump.
disable_bump_commit = false

# Whether to skip generating a changelog when running cog bump.
disable_changelog = false

# Hooks run before and after a version bump.
pre_bump_hooks = []
post_bump_hooks = []

# --- Changelog ---

[changelog]
# Path where the changelog file will be written.
path = "CHANGELOG.md"

# Template to use. Options: "remote" (includes PR/commit links), "full_hash", or a path to a custom template.
template = "remote"

# Remote host, owner, and repository are required for the "remote" template
# to generate links to commits and pull requests.
remote = "github.com"
owner = "IntactGlobal"
repository = "ig_cli"

# Map git commit signatures (email) to GitHub usernames for changelog attribution.
# [[changelog.authors]]
# signature = "user@example.com"
# username = "githubusername"

# --- Commit types ---
# Override or extend the default conventional commit types.
# By default the following types are supported:
#   feat, fix, docs, style, refactor, perf, test, chore, ci, revert
#
# Example: make "perf" commits bump the minor version instead of patch.
# [commit_types.perf]
# changelog_title = "Performance Improvements"
# bump_minor = true
#
# Example: hide "chore" commits from the changelog.
# [commit_types.chore]
# omit_from_changelog = true

[commit_types]
